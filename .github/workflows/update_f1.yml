name: Update F1 Fantasy Data

on:
  schedule:
    - cron: "0 6 * * 1" # 每週一 06:00 UTC 自動執行
  workflow_dispatch: # 允許你在網頁手動按按鈕立刻執行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Run scraper
        run: python scrape_f1.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1_fantasy_data.json
          git diff --staged --quiet || git commit -m "chore: update F1 Fantasy JSON data"
          git push
